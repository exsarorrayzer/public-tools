[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyurl-generator-checker"
version = "0.1.0"
description = "TinyURL Generator and Checker by github: exsarorrayzer"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "hypothesis>=6.92.0",
    "textual>=0.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
